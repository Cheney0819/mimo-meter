name: checks

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # ---------------------------------------------------------------- macOS
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 语法检查
        run: |
          node --check src/mimo-meter.mjs
          node --check src/overlay.js
          bash -n install.sh
          bash -n uninstall.sh
          bash -n scripts/check.sh

      - name: 版本号一致性
        run: node scripts/check-version.mjs

      - name: PowerShell 文件必须带 UTF-8 BOM
        shell: powershell
        run: |
          # PS 5.1 读无 BOM 的 UTF-8 文件会按 ANSI(GBK) 解码，中文全变乱码，
          # 用户双击运行时会看到乱码报错甚至闪退。
          $bad = 0
          foreach ($f in @("install.ps1","uninstall.ps1","scripts/jsonc_edit.ps1","scripts/test_jsonc_edit.ps1")) {
            $b = [IO.File]::ReadAllBytes($f)
            if ($b.Length -lt 3 -or $b[0] -ne 0xEF -or $b[1] -ne 0xBB -or $b[2] -ne 0xBF) {
              Write-Host "缺少 BOM: $f" -ForegroundColor Red
              $bad++
            } else {
              Write-Host "OK: $f"
            }
          }
          if ($bad -gt 0) { throw "$bad 个 .ps1 文件缺少 UTF-8 BOM" }

      - name: 配置编辑回归（Python）
        run: python3 scripts/test_jsonc_edit.py

      - name: 统计口径回归（SQL，合成库）
        run: node scripts/test-sql.mjs --synthetic

      - name: 浮层行为测试（headless Chrome）
        run: |
          CHROME="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          if [ -x "$CHROME" ]; then
            node scripts/test_overlay.mjs "$CHROME"
          else
            echo "::warning::runner 上没有 Chrome，跳过浮层行为测试"
          fi

      - name: 安装脚本端到端（假 HOME）
        run: |
          set -euo pipefail
          FAKE="$(mktemp -d)"
          mkdir -p "$FAKE/Library/Application Support/Xiaomi MiMo/engine-config"
          cat > "$FAKE/Library/Application Support/Xiaomi MiMo/engine-config/mimocode.jsonc" <<'JSONC'
          {
            // 保留我的注释和键
            "model": "keep-me",
            "plugin": [["file:///other/p.mjs", {"keep": true}]]
          }
          JSONC
          HOME="$FAKE" ./install.sh
          # 断言：其它顶层键还在、他人插件还在、自己已登记
          python3 - "$FAKE" <<'PY'
          import json, os, sys
          p = os.path.join(sys.argv[1], "Library/Application Support/Xiaomi MiMo/engine-config/mimocode.jsonc")
          d = json.load(open(p, encoding="utf-8-sig"))
          assert d.get("model") == "keep-me", "model 被弄丢了"
          specs = [e[0] for e in d["plugin"]]
          assert any("other/p.mjs" in s for s in specs), "他人插件被删了"
          assert any("mimo-meter.mjs" in s for s in specs), "自己没登记上"
          print("install.sh 端到端 OK")
          PY
          HOME="$FAKE" ./uninstall.sh
          python3 - "$FAKE" <<'PY'
          import json, os, sys
          p = os.path.join(sys.argv[1], "Library/Application Support/Xiaomi MiMo/engine-config/mimocode.jsonc")
          d = json.load(open(p, encoding="utf-8-sig"))
          assert d.get("model") == "keep-me"
          specs = [e[0] for e in d["plugin"]]
          assert not any("mimo-meter" in s for s in specs), "卸载没清干净"
          assert any("other/p.mjs" in s for s in specs), "卸载误删他人插件"
          print("uninstall.sh 端到端 OK")
          PY

  # ---------------------------------------------------------------- Windows
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 语法检查
        run: |
          node --check src/mimo-meter.mjs
          node --check src/overlay.js

      - name: 版本号一致性
        run: node scripts/check-version.mjs

      - name: PowerShell 文件必须带 UTF-8 BOM
        shell: powershell
        run: |
          # PS 5.1 读无 BOM 的 UTF-8 文件会按 ANSI(GBK) 解码，中文全变乱码，
          # 用户双击运行时会看到乱码报错甚至闪退。
          $bad = 0
          foreach ($f in @("install.ps1","uninstall.ps1","scripts/jsonc_edit.ps1","scripts/test_jsonc_edit.ps1")) {
            $b = [IO.File]::ReadAllBytes($f)
            if ($b.Length -lt 3 -or $b[0] -ne 0xEF -or $b[1] -ne 0xBB -or $b[2] -ne 0xBF) {
              Write-Host "缺少 BOM: $f" -ForegroundColor Red
              $bad++
            } else {
              Write-Host "OK: $f"
            }
          }
          if ($bad -gt 0) { throw "$bad 个 .ps1 文件缺少 UTF-8 BOM" }

      - name: 配置编辑回归（PowerShell 5.1）
        shell: powershell
        run: ./scripts/test_jsonc_edit.ps1

      - name: 配置编辑回归（PowerShell 7）
        shell: pwsh
        run: ./scripts/test_jsonc_edit.ps1

      - name: 统计口径回归（SQL，合成库）
        run: node scripts/test-sql.mjs --synthetic

      - name: 安装脚本端到端（假 APPDATA）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $fake = Join-Path ([IO.Path]::GetTempPath()) ("mm-e2e-" + [guid]::NewGuid().ToString("N").Substring(0,8))
          $cfg = Join-Path $fake "Xiaomi MiMo\engine-config"
          New-Item -ItemType Directory -Path $cfg -Force | Out-Null
          $jsonc = Join-Path $cfg "mimocode.jsonc"
          $utf8 = New-Object System.Text.UTF8Encoding $false
          # 用数组拼内容：PowerShell here-string 的结束符 "@ 必须顶行首，
          # 而 YAML 块标量会强制缩进，两者冲突，所以不用 here-string。
          $content = @(
            "{"
            "  // 保留我的注释和键"
            "  ""model"": ""keep-me"","
            "  ""plugin"": [[  ""file:///other/p.mjs"", { ""keep"": true } ]]"
            "}"
            ""
          ) -join "`n"
          [IO.File]::WriteAllText($jsonc, $content, $utf8)

          $env:APPDATA = $fake
          $env:LOCALAPPDATA = Join-Path $fake "Local"
          # 调 .ps1 不会设 $LASTEXITCODE；$ErrorActionPreference=Stop 会让
          # 脚本里的 exit N 以异常形式冒出来，所以用 try/catch 判定。
          try {
            & ./install.ps1 | Out-Host
          } catch {
            throw "install.ps1 失败：$_"
          }

          . ./scripts/jsonc_edit.ps1
          $d = ConvertFrom-Jsonc ([IO.File]::ReadAllText($jsonc))
          if ($d.model -ne "keep-me") { throw "model 被弄丢了" }
          $specs = @($d.plugin) | ForEach-Object { $_[0] }
          if (-not ($specs -match "other/p.mjs")) { throw "他人插件被删了" }
          if (-not ($specs -match "mimo-meter.mjs")) { throw "自己没登记上" }
          Write-Host "install.ps1 端到端 OK"

          try {
            & ./uninstall.ps1 | Out-Host
          } catch {
            throw "uninstall.ps1 失败：$_"
          }
          $d2 = ConvertFrom-Jsonc ([IO.File]::ReadAllText($jsonc))
          $specs2 = @($d2.plugin) | ForEach-Object { $_[0] }
          if ($specs2 -match "mimo-meter") { throw "卸载没清干净" }
          if (-not ($specs2 -match "other/p.mjs")) { throw "卸载误删他人插件" }
          Write-Host "uninstall.ps1 端到端 OK"
